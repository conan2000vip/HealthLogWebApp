<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

	<head>
		<meta charset="UTF-8">
		<title>プロフィール管理</title>
		<link rel="stylesheet" th:href="@{/css/common.css}">
		<link rel="stylesheet" th:href="@{/css/profile.css}">
	</head>

	<body>
		<header th:replace="~{layout/header :: header(activePage='profile')}"></header>

		<main class="profile-manage">
			<div class="profile-manage__top">
				<div>
					<h1 class="profile-manage__title">プロフィール管理</h1>
					<p class="profile-manage__subtitle">本人・家族のプロフィールを管理します</p>
				</div>

				<a th:if="${#lists.size(profiles) < 10}" th:href="@{/profile/new}" class="btn btn--primary">
					<i data-lucide="plus"></i>
					<span>追加</span>
				</a>
				<p th:if="${#lists.size(profiles) >= 10}" style="color:#999; font-size:0.85rem;">プロフィールは最大10件までです</p>
			</div>

			<!-- Business Error / Success -->
			<div class="alert alert--error" th:if="${error}" id="errorAlert" data-auto-hide="true">
				<i data-lucide="alert-circle"></i><span th:text="${error}"></span>
				<button type="button" class="alert__close" onclick="this.closest('.alert').remove()">
					<i data-lucide="x"></i>
				</button>
			</div>
			<div class="alert alert--success" th:if="${message}" id="successAlert" data-auto-hide="true">
				<i data-lucide="check-circle"></i><span th:text="${message}"></span>
				<button type="button" class="alert__close" onclick="this.closest('.alert').remove()">
					<i data-lucide="x"></i>
				</button>
			</div>

			<!-- ===== Empty state ===== -->
			<div class="profile-manage__empty" th:if="${#lists.isEmpty(profiles)}">
				<img th:src="@{/image/user.png}" alt="" class="profile-manage__empty-icon" />
				<p class="profile-manage__empty-text">プロフィールがありません</p>
				<a th:href="@{/profile/new}" class="profile-manage__empty-link">最初のプロフィールを追加する</a>
			</div>

			<!-- ===== List ===== -->
			<div class="profile-manage__list" th:if="${!#lists.isEmpty(profiles)}">
				<div class="profile-manage__card" th:each="p : ${profiles}"
					 th:classappend="${currentProfile != null and p.id == currentProfile.id} ? ' is-current'">
					<span class="profile-manage__avatar"
						th:style="'background:' + (${p.profileColor} ?: '#94a3b8')"
						th:text="${#strings.substring(p.name,0,1)}">山</span>
					<div class="profile-manage__info">
						<div class="profile-manage__name-row">
							<span class="profile-manage__name" th:text="${p.name}">山田 太郎</span>

							<span class="badge badge--primary" th:if="${p.isPrimary}">本人</span>
							<span class="badge badge--relation" th:unless="${p.isPrimary}" th:text="${p.relationship}">父</span>
							<img th:src="@{/image/shield.png}" alt="" class="profile-manage__admin-icon" th:if="${p.isPrimary}" />
							<span class="badge badge--selected"
								  th:if="${currentProfile != null and p.id == currentProfile.id}">選択中</span>
						</div>
						<div class="profile-manage__meta">
							<span th:text="${#temporals.format(p.birthDate, 'yyyy-MM-dd')}">1974-01-01</span>
							(<span th:text="${p.age}">52</span>歳)
							/ 身長: <span th:text="${p.height}">175</span>cm
						</div>
					</div>

					<div class="profile-manage__actions">
						<form th:if="${currentProfile == null or p.id != currentProfile.id}"
							  th:action="@{/profile/switch/{id}(id=${p.id})}" method="post">
							  <button type="submit" class="btn btn--outline btn--sm">選択
								<img th:src="@{/image/check.png}" alt="" class="btn-icon" />
							  </button>
						</form>

						<a th:href="@{/profile/{id}/edit(id=${p.id})}" class="icon-btn" aria-label="編集">
							<img th:src="@{/image/edit.png}" alt="編集" class="icon-btn-img" />
						</a>

						<form th:if="${!p.isPrimary}" th:action="@{/profile/delete}" method="post"
						      class="delete-form" style="display:inline"
						      th:attr="data-confirm-message='「' + ${p.name} + '」のプロフィールを削除しますか？'">
						    <input type="hidden" name="profileId" th:value="${p.id}" />
						    <button type="submit" class="icon-btn icon-btn--danger" aria-label="削除">
						        <img th:src="@{/image/delete.png}" alt="削除" class="icon-btn-img" />
						    </button>
						</form>
					</div>
				</div>
			</div>
		</main>

		<div th:replace="~{layout/confirm-modal :: deleteModal}"></div>

		<script src="https://unpkg.com/lucide@latest"></script>
		<script th:src="@{/js/common.js}"></script>
	</body>

</html>

<!DOCTYPE html>
<html lang="ja" xmlns:th="http://thymeleaf.org">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>体重管理 | HealthLog</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" />
	<link rel="stylesheet" th:href="@{/css/common.css}" />
	<link rel="stylesheet" th:href="@{/css/weight.css}" />
</head>

<body>

	<!-- ===== Header ===== -->
	<div th:replace="~{layout/header :: header(activePage='weight')}"></div>

	<!-- =====================================================================
	     模型属性メモ（コントローラ側で用意する想定）:

	     currentProfile      : ヘッダーで使用中のプロフィール（name 属性を使用）
	     stats.latest        : 最新の体重 (BigDecimal, nullable)
	     stats.min           : 期間内の最小体重 (BigDecimal, nullable)
	     stats.max           : 期間内の最大体重 (BigDecimal, nullable)
	     stats.bmi           : 最新のBMI (BigDecimal, nullable)
	     stats.bmiStatus     : BMI判定文言 ("低体重" / "標準" / "肥満" 等, nullable)
	     stats.bmiStatusCode : BMI判定の状態区分 ("low" / "normal" / "high" 等, CSS装飾用)
	     weightRecords       : List<WeightRecordView> 新しい日付順（降順）で並んでいる想定
	         - id, date (yyyy-MM-dd 文字列 or LocalDate), weight, height, bmi, bmiStatus, memo
	     filterStartDate     : 検索条件（絞り込み開始日, 任意）
	     filterEndDate       : 検索条件（絞り込み終了日, 任意）
	     error / message     : 共通のエラー・成功メッセージ
	     ===================================================================== -->

	<main class="weight-page">
		<div class="weight-page__inner">

			<!-- Page Header -->
			<div class="weight-page__header">
				<div class="weight-page__heading">
					<span class="weight-page__icon"><i data-lucide="scale"></i></span>
					<div>
						<h1>体重管理</h1>
						<p th:text="${(currentProfile?.name ?: 'ゲスト') + ' の体重記録'}">山田 太郎 の体重記録</p>
					</div>
				</div>
				<button type="button" class="btn btn--primary" id="openAddModalBtn">
					<i data-lucide="plus"></i>記録する
				</button>
			</div>

			<!-- Business Error / Success -->
			<div class="alert alert--error" th:if="${error}">
				<i data-lucide="alert-circle"></i><span th:text="${error}"></span>
			</div>
			<div class="alert alert--success" th:if="${message}">
				<i data-lucide="check-circle"></i><span th:text="${message}"></span>
			</div>

			<!-- Summary Cards -->
			<div class="summary-grid">
				<div class="summary-card">
					<span class="summary-card__label">最新</span>
					<span class="summary-card__value">
						<span th:text="${stats?.latest != null ? stats.latest : '--'}">65</span> kg
					</span>
				</div>
				<div class="summary-card">
					<span class="summary-card__label">最小</span>
					<span class="summary-card__value">
						<span th:text="${stats?.min != null ? stats.min : '--'}">59</span> kg
					</span>
				</div>
				<div class="summary-card">
					<span class="summary-card__label">最大</span>
					<span class="summary-card__value">
						<span th:text="${stats?.max != null ? stats.max : '--'}">66</span> kg
					</span>
				</div>
				<div class="summary-card">
					<span class="summary-card__label">BMI</span>
					<span class="summary-card__value">
						<span th:text="${stats?.bmi != null ? stats.bmi : '--'}">21.2</span>
						<span class="badge" th:if="${stats?.bmiStatus}"
							th:classappend="${'badge--' + (stats?.bmiStatusCode ?: 'normal')}"
							th:text="${stats.bmiStatus}">標準</span>
					</span>
				</div>
			</div>

			<!-- Filter -->
			<form class="filter-bar" th:action="@{/weight}" method="get">
				<i data-lucide="search"></i>
				<span class="filter-bar__label">期間:</span>
				<input type="date" name="startDate" th:value="${filterStartDate}" />
				<span class="filter-bar__sep">〜</span>
				<input type="date" name="endDate" th:value="${filterEndDate}" />
				<button type="submit" class="btn btn--ghost btn--sm">絞り込む</button>
				<a th:href="@{/weight}" class="filter-bar__reset"
					th:if="${filterStartDate != null or filterEndDate != null}">条件をクリア</a>
			</form>

			<!-- Chart -->
			<section class="chart-card">
				<div class="chart-card__header">
					<h2>体重推移グラフ</h2>
					<button type="button" class="link-btn" id="toggleChartBtn">非表示</button>
				</div>
				<div class="chart-card__body" id="chartWrapper">
					<canvas id="weightChart" height="260"></canvas>
					<p class="chart-card__empty" id="chartEmpty" th:if="${#lists.isEmpty(weightRecords)}">
						記録がまだありません。まずは体重を記録しましょう。
					</p>
				</div>
			</section>

			<!-- Table -->
			<section class="table-card">
				<table class="weight-table" th:if="${not #lists.isEmpty(weightRecords)}">
					<thead>
						<tr>
							<th>日付</th>
							<th>体重 (kg)</th>
							<th>BMI</th>
							<th>メモ</th>
							<th class="weight-table__actions-col"></th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="record : ${weightRecords}"
							th:data-date="${record.date}"
							th:data-weight="${record.weight}">
							<td th:text="${record.date}">2026-07-14</td>
							<td class="weight-table__weight">
								<span th:text="${record.weight}">65</span>
								<span class="diff-badge" data-diff-placeholder></span>
							</td>
							<td>
								<span class="badge" th:if="${record.bmi != null}"
									th:classappend="${'badge--' + (record.bmiStatusCode ?: 'normal')}"
									th:text="${record.bmi}">21.2</span>
								<span class="text-muted" th:unless="${record.bmi != null}">--</span>
							</td>
							<td class="weight-table__memo" th:text="${record.memo ?: ''}"></td>
							<td class="weight-table__actions">
								<button type="button" class="icon-btn edit-btn"
									th:data-id="${record.id}"
									th:data-date="${record.date}"
									th:data-weight="${record.weight}"
									th:data-height="${record.height}"
									th:data-memo="${record.memo}"
									title="編集">
									<i data-lucide="pencil"></i>
								</button>
								<form th:action="@{/weight/{id}/delete(id=${record.id})}" method="post"
									class="delete-form">
									<button type="submit" class="icon-btn icon-btn--danger" title="削除">
										<i data-lucide="trash-2"></i>
									</button>
								</form>
							</td>
						</tr>
					</tbody>
				</table>

				<div class="empty-state" th:if="${#lists.isEmpty(weightRecords)}">
					<i data-lucide="scale"></i>
					<p>まだ体重が記録されていません</p>
					<button type="button" class="btn btn--primary" id="openAddModalBtnEmpty">
						<i data-lucide="plus"></i>最初の記録をつける
					</button>
				</div>
			</section>

		</div>
	</main>

	<!-- ===== Modal: 体重を記録する / 編集する ===== -->
	<div class="modal-overlay" id="weightModalOverlay">
		<div class="modal" role="dialog" aria-modal="true" aria-labelledby="weightModalTitle">
			<div class="modal__header">
				<h2 id="weightModalTitle">体重を記録する</h2>
				<button type="button" class="modal__close" id="closeModalBtn" aria-label="閉じる">
					<i data-lucide="x"></i>
				</button>
			</div>

			<form id="weightForm" th:action="@{/weight/save}" method="post" class="form" novalidate>
				<input type="hidden" name="id" id="recordId" value="" />

				<div class="input-group">
					<label for="date">日付 <span class="required">*</span></label>
					<input id="date" name="date" type="date" required />
					<div id="dateError" class="field-error"><span></span></div>
				</div>

				<div class="input-group">
					<label for="weight">体重 (kg) <span class="required">*</span></label>
					<input id="weight" name="weight" type="number" step="0.1" min="1" max="500"
						placeholder="例: 65.0" />
					<div id="weightError" class="field-error"><span></span></div>
				</div>

				<div class="input-group">
					<label for="height">
						<i data-lucide="ruler" class="input-group__icon"></i>
						身長 (cm) <span class="hint">※BMI計算用、子供の成長記録に</span>
					</label>
					<input id="height" name="height" type="number" step="0.1" min="30" max="250" placeholder="例: 165" />
					<div id="heightError" class="field-error"><span></span></div>
				</div>

				<div class="input-group">
					<label for="memo">メモ</label>
					<textarea id="memo" name="memo" rows="3" maxlength="200" placeholder="気づいたことなど..."></textarea>
				</div>

				<div class="modal__footer">
					<button type="button" class="btn btn--ghost" id="cancelModalBtn">キャンセル</button>
					<button type="submit" class="btn btn--primary btn--block">
						<i data-lucide="check"></i>保存する
					</button>
				</div>
			</form>
		</div>
	</div>

	<script src="https://unpkg.com/lucide@latest"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
	<script th:src="@{/js/common.js}"></script>
	<script th:src="@{/js/weight.js}"></script>

</body>

</html>

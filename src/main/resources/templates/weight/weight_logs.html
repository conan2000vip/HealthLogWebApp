<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>体重管理 | HealthLog</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" />
		<link rel="stylesheet" th:href="@{/css/common.css}" />
		<link rel="stylesheet" th:href="@{/css/weight.css}" />
	</head>

	<body>

		<!-- ===== Header ===== -->
		<div th:replace="~{layout/header :: header(activePage='weight')}"></div>

		<main class="weight-page">
			<div class="weight-page__inner">
				<!-- Page Header -->
				<div class="weight-page__header">
					<div class="weight-page__heading">
						<span class="weight-page__icon"><i data-lucide="scale"></i></span>
						<div>
							<h1>体重管理</h1>
							<p th:text="${currentProfile != null ? currentProfile.name + ' の体重記録' : 'ゲスト の体重記録'}">
						</div>
					</div>
					<button type="button" class="btn btn--primary" id="openAddModalBtn">
						<i data-lucide="plus"></i>記録する
					</button>
				</div>

				<!-- Business Error / Success -->
				<div class="alert alert--error" th:if="${error}" id="errorAlert">
					<i data-lucide="alert-circle"></i><span th:text="${error}"></span>
					<button type="button" class="alert__close" onclick="this.closest('.alert').remove()">
						<i data-lucide="x"></i>
					</button>
				</div>
				<div class="alert alert--success" th:if="${message}" id="successAlert">
					<i data-lucide="check-circle"></i><span th:text="${message}"></span>
					<button type="button" class="alert__close" onclick="this.closest('.alert').remove()">
						<i data-lucide="x"></i>
					</button>
				</div>

				<!-- Summary Cards -->
				<div class="summary-grid">
					<div class="summary-card">
						<span class="summary-card__label">最新</span>
						<span class="summary-card__value">
							<span th:text="${stats != null && stats.latest != null ? stats.latest : '--'}"></span> kg
						</span>
					</div>
					<div class="summary-card">
						<span class="summary-card__label">最小</span>
						<span class="summary-card__value">
							<span th:text="${stats != null && stats.min != null ? stats.min : '--'}"></span> kg
						</span>
					</div>
					<div class="summary-card">
						<span class="summary-card__label">最大</span>
						<span class="summary-card__value">
							<span th:text="${stats?.max != null ? stats.max : '--'}">66</span> kg
						</span>
					</div>
					<div class="summary-card">
						<span class="summary-card__label">BMI</span>
						<span class="summary-card__value">
							<span th:text="${stats?.bmi != null ? stats.bmi : '--'}">21.2</span>
							<span class="badge" th:if="${stats != null && stats.bmiStatus != null}"
								th:classappend="${stats != null && stats.bmiStatusCode != null ? stats.bmiStatusCode : 'normal'}"
								th:text="${stats.bmiStatus}">標準</span>
						</span>
					</div>
				</div>

				<!-- Filter -->
				<form class="filter-bar" th:action="@{/profile/{profileId}/weight(profileId=${profileId})}" method="get"
					id="filterForm">
					<i data-lucide="search"></i>
					<span class="filter-bar__label">期間:</span>
					<input type="date" name="startDate" th:value="${filterStartDate}" id="startDateInput"
						th:max="${T(java.time.LocalDate).now()}" />
					<span class="filter-bar__sep">〜</span>
					<input type="date" name="endDate" th:value="${filterEndDate}" id="endDateInput"
						th:max="${T(java.time.LocalDate).now()}" />
					<a th:href="@{/profile/{profileId}/weight(profileId=${profileId})}" class="filter-bar__reset"
						th:if="${filterStartDate != null or filterEndDate != null}">クリア</a>
				</form>

				<!-- Chart: chỉ hiện khi có data -->
				<section class="chart-card" th:if="${not #lists.isEmpty(logs)}">
					<div class="chart-card__header">
						<h2>体重推移グラフ</h2>
						<button type="button" class="link-btn" id="toggleChartBtn">非表示</button>
					</div>
					<div class="chart-card__body" id="chartWrapper">
						<canvas id="weightChart" height="260"></canvas>
					</div>
				</section>

				<!-- Table / Empty state -->
				<section class="table-card">
					<div class="data-table-scroll">
						<table class="weight-table" data-history-table th:if="${not #lists.isEmpty(logs)}">
							<thead>
								<tr>
									<th>日付</th>
									<th>体重 (kg)</th>
									<th>BMI</th>
									<th>メモ</th>
									<th class="weight-table__actions-col"></th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="record : ${logs}" th:data-date="${record.recordedDate}"
									th:data-value="${record.weight}">
									<td th:text="${record.recordedDate}">2026-07-14</td>
									<td class="weight-table__weight">
										<span th:text="${record.weight}">65</span>
										<span class="diff-badge" data-diff-placeholder></span>
									</td>
									<td>
										<span class="badge" th:if="${record.bmi != null}"
											th:classappend="${'badge--' + (record.bmiStatusCode ?: 'normal')}"
											th:text="${record.bmi}">21.2</span>
										<span class="text-muted" th:unless="${record.bmi != null}">--</span>
									</td>
									<td class="weight-table__memo" th:text="${record.memo != null ? record.memo : ''}">
									</td>
									<td class="weight-table__actions">
										<button type="button" class="icon-btn edit-btn" th:data-id="${record.id}"
											th:data-date="${record.recordedDate}" th:data-weight="${record.weight}"
											th:data-height="${record.height}" th:data-memo="${record.memo}" title="編集">
											<i data-lucide="pencil"></i>
										</button>
										<form
											th:action="@{/profile/{profileId}/weight/{id}/delete(profileId=${profileId},id=${record.id})}"
											method="post" class="delete-form"
											data-confirm-message="この体重記録を削除しますか？&#10;この操作は取り消せません。">
											<button type="submit" class="icon-btn icon-btn--danger" title="削除">
												<i data-lucide="trash-2"></i>
											</button>
										</form>
									</td>
								</tr>
							</tbody>
						</table>
					</div>
					
					<div class="pagination" th:if="${totalPages > 1}">
						<a th:if="${hasPrevious}"
							th:href="@{/profile/{profileId}/weight(profileId=${profileId}, startDate=${filterStartDate}, endDate=${filterEndDate}, page=${currentPage - 1})}"
							class="pagination__nav">← 前へ</a>

						<a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
					       th:href="@{/profile/{profileId}/weight(profileId=${profileId}, startDate=${filterStartDate}, endDate=${filterEndDate}, page=${i})}"
					       th:text="${i + 1}"
					       th:classappend="${i == currentPage} ? 'is-active'"
					       class="pagination__page"></a>

					    <a th:if="${hasNext}"
					       th:href="@{/profile/{profileId}/weight(profileId=${profileId}, startDate=${filterStartDate}, endDate=${filterEndDate}, page=${currentPage + 1})}"
					       class="pagination__nav">次へ →</a>
					</div>

					<!-- Trường hợp 1: chưa có bản ghi nào, chưa lọc gì -->
					<div class="empty-state" th:if="${#lists.isEmpty(logs)} and ${filterStartDate == null} and ${filterEndDate == null}">
					<i data-lucide="scale"></i>
					<p>まだ体重が記録されていません</p>
					<button type="button" class="btn btn--primary" id="openAddModalBtnEmpty">
						<i data-lucide="plus"></i>最初の記録をつける
					</button>
				</div>

				<!-- Trường hợp 2: đang lọc nhưng không có kết quả -> gợi ý thêm dữ liệu -->
				<div class="empty-state"
					th:if="${#lists.isEmpty(logs)} and (${filterStartDate != null} or ${filterEndDate != null})">
					<i data-lucide="calendar-plus"></i>
					<p>選択した期間に記録がありません</p>
					<button type="button" class="btn btn--primary" id="openAddModalBtnFiltered"
						th:data-date="${filterStartDate}">
						<i data-lucide="plus"></i>この期間の記録を追加する
					</button>
				</div>
			</section>
	</main>

	<!-- ===== Modal: 体重を記録する / 編集する ===== -->
	<div class="modal-overlay" id="weightModalOverlay">
		<div class="modal" role="dialog" aria-modal="true" aria-labelledby="weightModalTitle">
			<div class="modal__header">
				<h2 id="weightModalTitle">体重を記録する</h2>
				<button type="button" class="modal__close" id="closeModalBtn" aria-label="閉じる">
					<i data-lucide="x"></i>
				</button>
			</div>

			<form id="weightForm" th:action="@{/profile/{profileId}/weight/save(profileId=${profileId})}" method="post"
				class="form" novalidate>
				<input type="hidden" name="recordId" id="recordId" value="" />

				<div class="input-group">
					<label for="date">日付 <span class="required">*</span></label>
					<input id="date" name="date" type="date" th:max="${T(java.time.LocalDate).now()}" required />
					<div id="dateError" class="field-error"><span></span></div>
				</div>

				<div class="input-group">
					<label for="weight">体重 (kg) <span class="required">*</span></label>
					<input id="weight" name="weight" type="number" step="0.1" min="1" max="500" placeholder="例: 65.0" />
					<div id="weightError" class="field-error"><span></span></div>
				</div>

				<div class="input-group">
					<label for="height">
						<i data-lucide="ruler" class="input-group__icon"></i>
						身長 (cm) <span class="hint">※BMI計算用、子供の成長記録に</span>
					</label>
					<input id="height" name="height" type="number" step="0.1" min="30" max="250" placeholder="例: 165" />
					<div id="heightError" class="field-error"><span></span></div>
				</div>

				<div class="input-group">
					<label for="memo">メモ</label>
					<textarea id="memo" name="memo" rows="3" maxlength="200" placeholder="気づいたことなど..."></textarea>
				</div>

				<div class="modal__footer">
					<button type="button" class="btn btn--ghost" id="cancelModalBtn">キャンセル</button>
					<button type="submit" class="btn btn--primary btn--block">
						<i data-lucide="check"></i>保存する
					</button>
				</div>
			</form>
		</div>
	</div>

	<!-- ===== Confirm Modal (削除確認) ===== -->
	<div th:replace="~{layout/confirm-modal :: confirmModal}"></div>

	<script src="https://unpkg.com/lucide@latest"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
	<script th:src="@{/js/common.js}"></script>
	<script th:inline="javascript">
		/*<![CDATA[*/
		window.weightChartData = {
			labels: /*[[${labels}]]*/[],
			values: /*[[${values}]]*/[]
		};
		/*]]>*/
	</script>
	<script th:src="@{/js/weight.js}"></script>

</body>

</html>

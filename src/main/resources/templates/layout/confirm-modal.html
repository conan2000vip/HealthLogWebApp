<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>

<div class="modal-overlay" id="deleteModalOverlay" th:fragment="confirmModal">
    <div class="modal modal--sm" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
        <div class="modal__header">
            <h2 id="deleteModalTitle">記録を削除</h2>
            <button type="button" class="modal__close" id="closeDeleteModalBtn" aria-label="閉じる">
                <i data-lucide="x"></i>
            </button>
        </div>
        <div class="modal__body">
            <p class="modal__message">この記録を削除しますか？</p>
        </div>
        <div class="modal__footer">
            <button type="button" class="btn btn--ghost" id="cancelDeleteBtn">キャンセル</button>
            <button type="button" class="btn btn--danger btn--block" id="confirmDeleteBtn">
                <i data-lucide="trash-2"></i>削除する
            </button>
        </div>
    </div>
</div>

</body>
</html>

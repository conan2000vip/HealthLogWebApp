<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>HealthLog - Login</title>
		<link rel="stylesheet" th:href="@{/css/auth.css}">
	</head>

	<body>
		<div class="auth-container">

			<!-- Background -->
			<div class="background">
				<img src="/image/background.jpg" alt="Background Image">
				<div class="overlay"></div>
			</div>

			<div class="auth-box">

				<!-- Logo -->
				<div class="logo-area">
					<img src="/image/logo.png" alt="HealthLog Logo">
					<h1>HealthLog</h1>
					<p>家族みんなの健康を、ひとつに。</p>
				</div>

				<!-- Card -->
				<div class="card">

					<!-- Tab -->
					<div class="tabs">
						<a th:href="@{/login}" class="tab active">ログイン</a>
						<a th:href="@{/register}" class="tab">新規登録</a>
					</div>

					<!-- Login Form -->
					<form th:action="@{/auth/login}" method="post" class="form">

						<!-- Error -->
						<div th:if="${error}" class="error">
							<i data-lucide="alert-circle"></i>
							<span th:text="${error}">エラー</span>
						</div>

						<!-- Email -->
						<div class="input-group">
							<label>メールアドレス</label>
							<input type="email" name="email" placeholder="example@email.com" required>
						</div>

						<!-- Password -->
						<div class="input-group">
							<label>パスワード</label>
							<div class="password-box">
								<input id="password" type="password" name="password" placeholder="パスワード" required>
								<button type="button" onclick="togglePassword()">
									<i data-lucide="eye" id="eye"></i>
								</button>
							</div>
						</div>

						<!-- Submit -->
						<button class="submit-btn" type="submit">
							<i data-lucide="activity"></i>ログイン
						</button>

						<!-- Forgot -->
						<a class="forgot" th:href="@{/password-reset}">
							パスワードをお忘れですか？
						</a>

						<!-- Security message-->
						<p class="security">健康データは安全に暗号化されて保存されます</p>

					</form>
				</div>

			</div>
		</div>

		<script src="https://unpkg.com/lucide@latest"></script>
		<script>
			lucide.createIcons();
		</script>

	</body>

</html>

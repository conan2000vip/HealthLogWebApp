<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>HealthLog - Register</title>
		<link rel="stylesheet" th:href="@{/css/auth.css}" />
	</head>

	<body>
		<div class="auth-container">
			<!-- Background -->
			<div class="background">
				<img th:src="@{/image/background.jpg}" alt="Background" />
				<div class="overlay"></div>
			</div>

			<div class="auth-box">
				<!-- Logo -->
				<div class="logo-area">
					<img th:src="@{/image/logo.png}" alt="HealthLog Logo" />
					<h1>HealthLog</h1>
					<p>家族みんなの健康を、ひとつに。</p>
				</div>

				<!-- Card -->
				<div class="card">
					<!-- Tab -->
					<div class="tabs">
						<a th:href="@{/auth/login}" class="tab">ログイン</a>
						<a th:href="@{/auth/register}" class="tab active">新規登録</a>
					</div>

					<!-- Business Error -->
					<div id="backendError" class="error-message" th:if="${error}">
						<i data-lucide="alert-circle"></i>
						<span th:text="${error}"></span>
					</div>

					<!-- Success Message -->
					<div class="success-message" th:if="${message}">
						<span th:text="${message}"></span>
					</div>

					<!-- Register Form -->
					<form id="registerForm" th:action="@{/auth/register}" method="post" class="form" novalidate>

						<!-- Email -->
						<div class="input-group">
							<label for="email">メールアドレス</label>
							<input id="email" name="email" type="email" th:value="${email}"
								th:classappend="${emailError} ? ' invalid' : ''" placeholder="example@email.com"
								autocomplete="email" />
							<div id="emailError" class="field-error" th:classappend="${emailError} ? ' show' : ''">
								<i data-lucide="alert-circle"></i>
								<span th:text="${emailError}"></span>
							</div>
						</div>

						<!-- Password -->
						<div class="input-group">
							<label for="password">パスワード</label>
							<div class="password-box">
								<input id="password" name="password" type="password"
									th:classappend="${passwordError} ? ' invalid' : ''" placeholder="パスワード"
									autocomplete="new-password" />
								<button id="togglePassword" type="button">
									<i data-lucide="eye" id="eye"></i>
								</button>
							</div>
							<div id="passwordError" class="field-error"
								th:classappend="${passwordError} ? ' show' : ''">
								<i data-lucide="alert-circle"></i>
								<span th:text="${passwordError}"></span>
							</div>
						</div>
						
						<!-- Confirm Password -->
						<div class="input-group">
							<label for="confirmPassword">パスワード確認</label>
							<div class="password-box">
								<input id="confirmPassword" name="confirmPassword" type="Password"
									placeholder="パスワードを再入力" autocomplete="new-password" />
								<button id="toggleConfirmPassword" type="button">
									<i data-lucide="eye" id="eyeConfirmPassword"></i>
								</button>
							</div>
							<div id="confirmPasswordError" class="field-error">
								<i data-lucide="alert-circle"></i>
								<span></span>
							</div>
						</div>

						<!-- Submit -->
						<button class="submit-btn" type="submit">
							<i data-lucide="activity"></i>登録する
						</button>

						<!-- Security message -->
						<p class="security">健康データは安全に暗号化されて保存されます</p>
					</form>
				</div>
			</div>
		</div>

		<script src="https://unpkg.com/lucide@latest"></script>
		<script th:src="@{/js/common.js}"></script>
		<script th:src="@{/js/register.js}"></script>
	</body>

</html>

<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>新しいパスワードを設定 | HealthLog</title>
		<link rel="stylesheet" th:href="@{/css/auth.css}" />
	</head>

	<body>
		<div class="auth-container">
			<!-- Background -->
			<div class="background">
				<img th:src="@{/image/background.jpg}" alt="Background" />
				<div class="overlay"></div>
			</div>

			<div class="auth-box">
				<!-- Logo -->
				<div class="logo-area">
					<img th:src="@{/image/logo.png}" alt="HealthLog Logo" />
					<h1>HealthLog</h1>
					<p>家族みんなの健康を、ひとつに。</p>
				</div>

				<!-- Card -->
				<div class="card">
					<h2>新しいパスワードを設定</h2>
					<p class="description">
						新しいパスワードを入力してください。
					</p>

					<!-- Business Error -->
					<div class="error-message" th:if="${error}">
						<i data-lucide="alert-circle"></i><span th:text="${error}"></span>
					</div>

					<!-- Success Message -->
					<div class="success-message" th:if="${message}">
						<span th:text="${message}"></span>
					</div>

					<!-- Reset Password Form -->
					<form th:action="@{/auth/password-reset}" th:object="${resetPasswordRequest}" method="post"
						class="form">
						<!-- Token (hidden, prefilled from URL by controller) -->
						<input type="hidden" th:field="*{token}" />

						<!-- New Password -->
						<div class="input-group">
							<label for="newPassword">新しいパスワード</label>
							<div class="password-box">
								<input id="newPassword" type="password" th:field="*{newPassword}"
									placeholder="新しいパスワード" />
								<button id="toggleNewPassword" type="button">
									<i data-lucide="eye"></i>
								</button>
							</div>
							<small class="validation-error" th:if="${#fields.hasErrors('newPassword')}"
                            th:errors="*{newPassword}"></small>
                    </div>

                    <!-- Confirm Password -->
                    <div class="input-group">
                        <label for="confirmPassword">パスワード（確認）</label>
                        <div class="password-box">
                            <input id="confirmPassword" type="password" th:field="*{confirmPassword}"
                                placeholder="もう一度入力してください" />
                            <button id="toggleConfirmPassword" type="button">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>
                        <small class="validation-error" th:if="${#fields.hasErrors('confirmPassword')}"
                            th:errors="*{confirmPassword}"></small>
                    </div>

                    <!-- Submit -->
                    <button class="submit-btn" type="submit">
                        <i data-lucide="check"></i>パスワードを変更する
                    </button>
                </form>
                <a class="forgot" th:href="@{/auth/login}">ログイン画面に戻る</a>

                <!-- Security -->
                <p class="security">健康データは安全に暗号化されて保存されます</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
		lucide.createIcons();

		function setupToggle(inputId, buttonId) {
			const input = document.getElementById(inputId);
			const button = document.getElementById(buttonId);

			button.addEventListener("click", function () {
				if (input.type === "password") {
					input.type = "text";
					button.innerHTML = '<i data-lucide="eye-off"></i>';
				} else {
					input.type = "password";
					button.innerHTML = '<i data-lucide="eye"></i>';
				}
				lucide.createIcons();
			});
		}

		setupToggle("newPassword", "toggleNewPassword");
		setupToggle("confirmPassword", "toggleConfirmPassword");
	</script>
</body>

</html>

<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>パスワード再設定 | HealthLog</title>
		<link rel="stylesheet" th:href="@{/css/auth.css}" />
	</head>

	<body>
		<div class="auth-container">
			<!-- Background -->
			<div class="background">
				<img th:src="@{/image/background.jpg}" alt="Background" />
				<div class="overlay"></div>
			</div>

			<div class="auth-box">
				<!-- Logo -->
				<div class="logo-area">
					<img th:src="@{/image/logo.png}" alt="HealthLog Logo" />
					<h1>HealthLog</h1>
					<p>家族みんなの健康を、ひとつに。</p>
				</div>

				<!-- Card -->
				<div class="card">
					<h2>パスワードを再設定</h2>
					<p class="description">
						登録したメールアドレスを入力してください。<br />
						再設定用リンクを送信します。
					</p>

					<!-- Business Error -->
					<div class="error-message" th:if="${error}">
						<i data-lucide="alert-circle"></i><span th:text="${error}"></span>
					</div>

					<!-- Success Message -->
					<div class="success-message" th:if="${message}">
						<span th:text="${message}"></span>
					</div>

					<!-- Forgot Password Form -->
					<form th:action="@{/auth/forgot-password}" th:object="${forgotPasswordRequest}" method="post"
						class="form">
						<div class="input-group">
							<label for="email">メールアドレス</label>
							<input id="email" type="email" th:field="*{email}" placeholder="example@email.com" />
							<small class="validation-error" th:if="${#fields.hasErrors('email')}"
                            th:errors="*{email}"></small>
                    </div>

                    <button class="submit-btn" type="submit">
                        <i data-lucide="send"></i>再設定メールを送信
                    </button>
                </form>

                <a class="forgot" th:href="@{/auth/login}">ログイン画面に戻る</a>

                <!-- Security -->
                <p class="security">健康データは安全に暗号化されて保存されます</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
		lucide.createIcons();
	</script>
</body>

</html>

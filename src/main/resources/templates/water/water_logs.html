<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>水分管理 | HealthLog</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" />
		<link rel="stylesheet" th:href="@{/css/common.css}" />
		<link rel="stylesheet" th:href="@{/css/water.css}" />
	</head>

	<body>

		<!-- ===== Header ===== -->
		<div th:replace="~{layout/header :: header(activePage='water')}"></div>
		<main class="water-page">
			<div class="water-page__inner">

				<!-- Page Header -->
				<div class="water-page__header">
					<div class="water-page__heading">
						<span class="water-page__icon">
							<img th:src="@{/image/water.png}" alt="" class="water-page__icon-img" />
						</span>
						<div>
							<h1>水分管理</h1>
							<p th:text="${currentProfile != null ? currentProfile.name + ' の水分記録' : 'ゲスト の水分記録'}"></p>
						</div>
					</div>
					<button type="button" class="btn btn--primary" id="openAddModalBtn">
						<i data-lucide="plus"></i>記録する
					</button>
				</div>

				<!-- Business Error / Success -->
				<div class="alert alert--error" th:if="${error}" id="errorAlert" data-auto-hide="true">
					<i data-lucide="alert-circle"></i><span th:text="${error}"></span>
					<button type="button" class="alert__close" onclick="this.closest('.alert').remove()">
						<i data-lucide="x"></i>
					</button>
				</div>
				<div class="alert alert--success" th:if="${message}" id="successAlert" data-auto-hide="true">
					<i data-lucide="check-circle"></i><span th:text="${message}"></span>
					<button type="button" class="alert__close" onclick="this.closest('.alert').remove()">
						<i data-lucide="x"></i>
					</button>
				</div>

				<!--  Feedback -->
				<div th:replace="~{layout/data-controls :: feedbackList(feedbackList=${feedbackList})}"></div>

				<!-- Summary Cards -->
				<div class="summary-grid">
					<div class="summary-card">
						<span class="summary-card__label">最新</span>
						<span class="summary-card__value">
							<span th:text="${stats?.latest ?: '--'}"></span> ml
						</span>
					</div>

					<div class="summary-card">
						<span class="summary-card__label">今日合計</span>
						<span class="summary-card__value">
							<span th:text="${stats?.todayTotal ?: '--'}"></span> ml
						</span>
					</div>

					<div class="summary-card">
						<span class="summary-card__label">今月平均</span>
						<span class="summary-card__value">
							<span th:text="${stats?.monthAverage ?: '--'}"></span> ml
						</span>
					</div>

					<div class="summary-card">
						<span class="summary-card__label">目標達成率</span>
						<span class="summary-card__value">
							<span th:text="${stats?.goalRate ?: '--'}"></span>%
						</span>
					</div>
				</div>

				<!-- Filter Bar (dùng chung) -->
				<div th:replace="~{layout/data-controls :: filterBar(
				actionUrl=@{/profile/{profileId}/water(profileId=${profileId})},
				clearUrl=@{/profile/{profileId}/water(profileId=${profileId})},
				filterStartDate=${filterStartDate},
				filterEndDate=${filterEndDate})}">
				</div>

				<!-- Chart Card (dùng chung) -->
				<div th:replace="~{layout/data-controls :: chartCard(
				title='水分摂取量推移',
				canvasId='waterChart',
				hasData=${not #lists.isEmpty(logs)})}">
				</div>

				<!-- Table / Empty state -->
				<section class="table-card">
					<div class="data-table-scroll">
						<table class="water-table" data-history-table th:if="${not #lists.isEmpty(logs)}">
							<thead>
								<tr>
									<th>日付</th>
									<th>時間</th>
									<th>飲み物</th>
									<th>量 (ml)</th>
									<th>目標比</th>
									<th>メモ</th>
									<th class="water-table__actions-col"></th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="record : ${logs}" th:data-date="${record.recordedDate}" th:data-value="${record.amountMl}">
									<td th:text="${record.recordedDate}">2026-08-03</td>
									<td class="water-table__time"
										th:text="${record.recordedTime != null ? #temporals.format(record.recordedTime,'HH:mm') : '--'}">
									</td>
									<td><span class="water-drink" th:text="${record.drinkType}">水</span></td>
									<td class="water-table__amount">
										<strong>
											<span th:text="${record.amountMl}">250</span> ml
										</strong>
									</td>
									<td>
										<span th:if="${record.goalRate != null}" class="badge"
											  th:classappend="${record.goalRate < 20 ? ' badge--danger' :record.goalRate < 50 ? ' badge--warning' :record.goalRate < 100 ? ' badge--info' :' badge--success'}"
											  th:text="${record.goalRate + '%'}">
										</span>
										<span th:unless="${record.goalRate != null}" class="text-muted">--</span>
									</td>
									<td class="water-table__memo memo-cell" th:text="${record.memo != null ? record.memo : ''}"
										th:attr="data-full-memo=${record.memo != null ? record.memo : ''}">
									</td>
									<td class="water-table__actions">
										<button type="button" class="icon-btn edit-btn" th:data-id="${record.id}"
												th:data-date="${record.recordedDate}" th:data-drink-type="${record.drinkType}"
												th:data-amount="${record.amountMl}" th:data-time="${record.recordedTime}"
												th:data-memo="${record.memo}" aria-label="編集">
											<img th:src="@{/image/edit.png}" alt="編集" class="icon-btn-img" />
										</button>
										<form th:action="@{/profile/{profileId}/water/{id}/delete(profileId=${profileId},id=${record.id})}"
											  method="post" class="delete-form"
											  th:attr="data-confirm-message='「' + ${record.recordedDate} + '」の水分記録を削除しますか？&#10;この操作は取り消せません。'">
											<button type="submit" class="icon-btn icon-btn--danger" aria-label="削除">
												<img th:src="@{/image/delete.png}" alt="削除" class="icon-btn-img" />
											</button>
										</form>
									</td>
								</tr>
							</tbody>
						</table>
					</div>

					<div class="pagination" th:if="${totalPages > 1}">
						<a th:if="${hasPrevious}"
						   th:href="@{/profile/{profileId}/water(profileId=${profileId}, startDate=${filterStartDate}, endDate=${filterEndDate}, page=${currentPage - 1})}"
						   class="pagination__nav">← 前へ</a>

						<a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
							th:href="@{/profile/{profileId}/water(profileId=${profileId}, startDate=${filterStartDate}, endDate=${filterEndDate}, page=${i})}"
							th:text="${i + 1}" th:classappend="${i == currentPage} ? 'is-active'"
							class="pagination__page"></a>

						<a th:if="${hasNext}"
							th:href="@{/profile/{profileId}/water(profileId=${profileId}, startDate=${filterStartDate}, endDate=${filterEndDate}, page=${currentPage + 1})}"
							class="pagination__nav">次へ →</a>
					</div>

					<!-- Empty State : -->
					<div class="empty-state" th:if="${#lists.isEmpty(logs) and !hasAnyLog}">
					    <i data-lucide="droplets"></i>
					    <p>まだ水分が記録されていません</p>
					    <button type="button" class="btn btn--primary" id="openAddModalBtnEmpty">
					        <i data-lucide="plus"></i>最初の記録をつける
					    </button>
					</div>

					<!-- Empty State for Filtered Results -->
					<div class="empty-state" th:if="${#lists.isEmpty(logs) and hasAnyLog}">
					    <i data-lucide="calendar-days"></i>
					    <p>選択した期間に記録がありません</p>
					    <button type="button" class="btn btn--primary" id="openAddModalBtnFiltered"
					        th:data-date="${filterStartDate}">
					        <i data-lucide="plus"></i>この期間の記録を追加する
					    </button>
					</div>
				</section>
			</div>
		</main>

		<!-- ===== Modal: 水分を記録する / 編集する ===== -->
		<div class="modal-overlay" id="waterModalOverlay">
			<div class="modal" role="dialog" aria-modal="true" aria-labelledby="waterModalTitle">
				<div class="modal__header">
					<h2 id="waterModalTitle">水分を記録する</h2>
					<button type="button" class="modal__close" id="closeModalBtn" aria-label="閉じる">
						<i data-lucide="x"></i>
					</button>
				</div>

				<form id="waterForm" th:action="@{/profile/{profileId}/water/save(profileId=${profileId})}"
					method="post" class="form" novalidate>
					<input type="hidden" name="recordId" id="recordId" value="" />

					<div class="input-group">
					    <label for="recordedDate">日付 <span class="required">*</span></label>
					    <input id="recordedDate" name="recordedDate" type="date" th:max="${T(java.time.LocalDate).now()}" required>
					    <div id="recordedDateError" class="field-error"><span></span></div>
					</div>

					<input type="hidden" id="recordedTime" name="recordedTime">

					<div class="input-group">
						<label for="drinkType">飲み物<span class="required">*</span></label>
						<select id="drinkType" name="drinkType" required>
							<option value="">選択してください</option>
							<option value="WATER">水</option>
							<option value="TEA">お茶</option>
							<option value="COFFEE">コーヒー</option>
							<option value="JUICE">ジュース</option>
							<option value="MILK">牛乳</option>
							<option value="SPORTS_DRINK">スポーツドリンク</option>
							<option value="OTHER">その他</option>
						</select>
						<div id="drinkTypeError" class="field-error"><span></span></div>
					</div>

					<div class="input-group">
						<label for="amountMl">水分量 (ml)<span class="required">*</span></label>
						<input type="number" id="amountMl" name="amountMl" min="1" max="5000" placeholder="250" required>
						<div id="amountMlError" class="field-error">
						    <span></span>
						</div>
					</div>

					<div class="input-group">
						<label for="memo">メモ</label>
						<textarea id="memo" name="memo" rows="3" maxlength="500" placeholder="気づいたことなど..."></textarea>
					</div>

					<div class="modal__footer">
						<button type="button" class="btn btn--ghost" id="cancelModalBtn">キャンセル</button>
						<button type="submit" class="btn btn--primary btn--block">
							<i data-lucide="check"></i>保存する
						</button>
					</div>
				</form>
			</div>
		</div>

		<!-- ===== Confirm Modal (削除確認) ===== -->
		<div th:replace="~{layout/confirm-modal :: deleteModal}"></div>

		<script src="https://unpkg.com/lucide@latest"></script>
		<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
		<script th:src="@{/js/common.js}"></script>
		<script th:inline="javascript">
			window.waterChartData = {
				labels: /*[[${labels}]]*/[],
				values: /*[[${values}]]*/[],
				chartMode: /*[[${chartMode}]]*/ "DAY",
				from: /*[[${chartFrom}]]*/ null,
				to: /*[[${chartTo}]]*/ null
			};
		</script>
		<script th:src="@{/js/water.js}"></script>

	</body>
</html>
